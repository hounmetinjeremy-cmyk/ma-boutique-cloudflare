<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commande confirmée | Ma Boutique</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center">
    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
      <i class="fas fa-check text-4xl text-green-600"></i>
    </div>
    <h1 class="text-2xl font-bold text-gray-900 mb-4">Merci pour votre commande !</h1>
    <p class="text-gray-600 mb-6">Votre commande a bien été enregistrée. Un email de confirmation vous sera envoyé prochainement.</p>
    <div class="bg-gray-50 rounded-xl p-4 mb-6">
      <p class="text-sm text-gray-500">Référence</p>
      <p class="font-mono text-gray-900 font-semibold" id="ref">#CMD-<script>document.write(Date.now().toString().slice(-8))</script></p>
    </div>
    <a href="/" class="inline-block w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold rounded-xl transition-all">
      Retour à la boutique
    </a>
  </div>
</body>
</html>
