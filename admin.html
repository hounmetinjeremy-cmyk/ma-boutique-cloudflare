<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration | Ma Boutique</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center text-white">
          <i class="fas fa-cog"></i>
        </div>
        <h1 class="text-xl font-bold text-gray-900">Administration</h1>
      </div>
      <a href="/" class="text-indigo-600 hover:text-indigo-700 font-medium">Retour à la boutique</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Login form -->
    <div id="login-section" class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-8">
      <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Connexion admin</h2>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
          <input type="password" id="admin-password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>
        <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold rounded-xl transition-all">
          Se connecter
        </button>
      </form>
      <p class="text-xs text-gray-500 mt-4 text-center">Par défaut : <code>admin123</code></p>
    </div>

    <!-- Orders dashboard -->
    <div id="dashboard-section" class="hidden">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold text-gray-900">Commandes reçues</h2>
        <button id="logout-btn" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg transition-colors">
          <i class="fas fa-sign-out-alt mr-2"></i>Déconnexion
        </button>
      </div>
      <div id="orders-list" class="space-y-4"></div>
    </div>
  </main>

  <script>
    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const ordersList = document.getElementById('orders-list');
    let adminToken = sessionStorage.getItem('adminToken');

    if (adminToken) {
      showDashboard();
      loadOrders();
    }

    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      const password = document.getElementById('admin-password').value;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const data = await res.json();
      if (data.success) {
        adminToken = data.token;
        sessionStorage.setItem('adminToken', adminToken);
        showDashboard();
        loadOrders();
      } else {
        alert(data.error || 'Mot de passe incorrect');
      }
    };

    document.getElementById('logout-btn').onclick = () => {
      sessionStorage.removeItem('adminToken');
      adminToken = null;
      location.reload();
    };

    function showDashboard() {
      loginSection.classList.add('hidden');
      dashboardSection.classList.remove('hidden');
    }

    async function loadOrders() {
      try {
        const res = await fetch('/api/admin/orders', {
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });
        const data = await res.json();
        if (data.error) {
          alert(data.error);
          sessionStorage.removeItem('adminToken');
          location.reload();
          return;
        }
        renderOrders(data.orders || []);
      } catch (err) {
        ordersList.innerHTML = '<p class="text-center text-red-500">Erreur de chargement</p>';
      }
    }

    function renderOrders(orders) {
      if (!orders.length) {
        ordersList.innerHTML = `
          <div class="bg-white rounded-2xl shadow-sm p-12 text-center text-gray-400">
            <i class="fas fa-inbox text-5xl mb-3"></i>
            <p>Aucune commande pour le moment</p>
          </div>
        `;
        return;
      }

      ordersList.innerHTML = orders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).map(order => `
        <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
          <div class="flex flex-wrap items-start justify-between gap-4 mb-4">
            <div>
              <p class="text-sm text-gray-500">Référence</p>
              <p class="font-mono font-bold text-gray-900">${order.id}</p>
            </div>
            <div class="text-right">
              <p class="text-sm text-gray-500">Date</p>
              <p class="font-semibold text-gray-900">${new Date(order.createdAt).toLocaleString('fr-FR')}</p>
            </div>
            <div class="text-right">
              <p class="text-sm text-gray-500">Total</p>
              <p class="text-xl font-bold text-indigo-600">${order.total.toFixed(2)} €</p>
            </div>
            <div>
              <span class="px-3 py-1 rounded-full text-xs font-semibold ${order.status === 'paid' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                ${order.status === 'paid' ? 'Payée' : 'En attente'}
              </span>
            </div>
          </div>
          <div class="grid md:grid-cols-2 gap-6">
            <div class="bg-gray-50 rounded-xl p-4">
              <p class="text-sm font-semibold text-gray-700 mb-2"><i class="fas fa-user mr-2"></i>Client</p>
              <p class="text-gray-900">${order.customer.firstName} ${order.customer.lastName}</p>
              <p class="text-gray-600 text-sm">${order.customer.email}</p>
              <p class="text-gray-600 text-sm">${order.customer.phone}</p>
            </div>
            <div class="bg-gray-50 rounded-xl p-4">
              <p class="text-sm font-semibold text-gray-700 mb-2"><i class="fas fa-map-marker-alt mr-2"></i>Adresse</p>
              <p class="text-gray-900">${order.customer.address}</p>
              <p class="text-gray-600 text-sm">${order.customer.zip} ${order.customer.city}</p>
            </div>
          </div>
          <div class="mt-4">
            <p class="text-sm font-semibold text-gray-700 mb-2"><i class="fas fa-box mr-2"></i>Articles</p>
            <ul class="text-sm text-gray-600 space-y-1">
              ${order.items.map(item => `<li>• ${item.name} — ${item.price.toFixed(2)} €</li>`).join('')}
            </ul>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
